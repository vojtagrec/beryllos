name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    branches:
      - 'main'
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build BeryllOS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      - name: Checkout files
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set kernel module signing key
        run: echo "${KMOD_PRIVATE_KEY}" > "${GITHUB_WORKSPACE}/kmod.priv"
        env:
          KMOD_PRIVATE_KEY: ${{ secrets.KMOD_PRIVATE_KEY }}

      - name: Mount BTRFS loopback
        uses: ublue-os/container-storage-action@911baca08baf30c8654933e9e9723cb399892140
        with:
          target-dir: /home/runner/.local/share/containers/storage
          mount-opts: compress-force=zstd:2
          loopback-free: 0.6

      # the build is fully handled by the reusable github action
      - name: Build image
        uses: blue-build/github-action@v1.10
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
          # we handle checkout above to accomodate for kernel module signing key
          skip_checkout: true
          # reduce layer sizes by usind chunked builds
          build_chunked_oci: true
          # remove base image to free more space, might be added as a param in https://github.com/blue-build/github-action/pull/131
          build_opts: "--remove-base-image"
          